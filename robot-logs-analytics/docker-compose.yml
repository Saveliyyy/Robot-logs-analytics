# Учебный запуск Airflow одним контейнером (standalone: веб-интерфейс + планировщик + SQLite).
# Для продакшена используйте официальный docker-compose.yaml с PostgreSQL и CeleryExecutor.
#
#   docker compose up
#   открыть http://localhost:8080, логин admin, пароль — в логах контейнера
#   (строка "Login with username: admin  password: ...")

services:
  airflow:
    image: apache/airflow:2.10.5-python3.11
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "scikit-learn openpyxl matplotlib"
    volumes:
      - ./:/opt/airflow/project
